<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gratitude Journal - MindMentor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container">
    <h1>🙏 Gratitude Journal</h1>

    <form method="POST" action="{{ url_for('checkin.save_gratitude') }}" class="gratitude-form">
  <textarea name="gratitude" rows="4" placeholder="What are you grateful for today?" required></textarea>
  <button type="submit" class="btn">💾 Save Entry</button>
</form>


    {% if entries %}
    <section class="archive">
      <h2>🗂️ Your Past Gratitude Entries</h2>
      <ul>
        {% for entry in entries %}
          <li><strong>{{ entry.timestamp }}</strong> — {{ entry.text }}</li>
        {% endfor %}
      </ul>
    </section>
    {% endif %}
  </main>
</body>
</html>
